# LiteLLM proxy config for the Memory Rebirth Attack MWE.
# NOT used yet. When you are ready:
#   1. put real keys in .env (LiteLLM reads os.environ/*)
#   2. litellm --config litellm_config.yaml   (serves OpenAI-compatible on :4000)
#   3. in mwe/.env set LLM_PROVIDER=litellm (and/or EMBED_PROVIDER=litellm),
#      LITELLM_LLM_MODEL / LITELLM_EMBED_MODEL to a model_name below.
#
# RULE: every Gemini-backed route disables all four adjustable safety filters
# (BLOCK_NONE) because this is a controlled security test. See litellm_params.safety_settings.

model_list:
  # ---- Gemini (safety disabled) ----
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
      safety_settings:
        - category: HARM_CATEGORY_HARASSMENT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_HATE_SPEECH
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_DANGEROUS_CONTENT
          threshold: BLOCK_NONE

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
      safety_settings:
        - category: HARM_CATEGORY_HARASSMENT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_HATE_SPEECH
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_DANGEROUS_CONTENT
          threshold: BLOCK_NONE

  # ---- Local Ollama (no safety layer) ----
  - model_name: qwen-3b
    litellm_params:
      model: ollama/qwen2.5:3b-instruct
      api_base: http://localhost:11434

  # ---- Add Claude / GPT / others here later for cross-model sensitivity tests ----
  # - model_name: claude-sonnet
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
